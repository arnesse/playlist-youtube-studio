name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Compiler l application et l installeur
        shell: powershell
        run: .\build\build_windows.ps1

      - name: Publier l installeur
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistYouTubeStudio-Windows
          path: dist/PlaylistYouTubeStudio-Setup.exe
          if-no-files-found: error
